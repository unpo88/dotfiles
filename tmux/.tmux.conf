# ===== 기본 설정 =====
set -g mouse on

# Extended keys (Shift/Alt/Ctrl + Enter 등 수정 키 조합 전달)
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g detach-on-destroy on

# vi 모드
set-window-option -g mode-keys vi

# ===== Copy mode → 시스템 클립보드 (macOS pbcopy) =====
# copy-mode-vi 에서 v 로 선택 시작, y 로 복사하고 copy-mode 빠져나옴
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# 마우스 드래그로 선택 끝나는 순간에도 자동 복사
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ===== 키 바인딩 =====
# 분할 시 현재 디렉터리 유지
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# 설정 reload
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded!"

# ===== Window 빠른 이동 (prefix 없이 Ctrl+숫자) =====
# 워크플로우 규약:
#   :1 = nvim (코드)
#   :2 = be-fe (BE + FE 서버)
#   :3 = sqlit (ldb 로 생성)
bind-key -n C-1 select-window -t :1
bind-key -n C-2 select-window -t :2
bind-key -n C-3 select-window -t :3

# ===== Work Dev/Debug 세션 =====
# Prefix + S / Prefix + C-s: 일반 dev 세션 (Worktrunk이면 worktree별 서버)
bind-key S run-shell "~/.tmux/scripts/start-dev-session.sh '#{pane_current_path}'"
bind-key C-s run-shell "~/.tmux/scripts/start-dev-session.sh '#{pane_current_path}'"

# Prefix + B: 디버그 세션 (BE는 nvim DAP, FE는 pnpm start)
bind-key B run-shell "~/.tmux/scripts/start-debug-session.sh '#{pane_current_path}'"

# ===== Catppuccin 테마 & Status Bar =====
set -g @catppuccin_flavor "macchiato" # latte, frappe, macchiato, mocha

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

# Status bar
set -g status-justify left
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Window 색감 (macchiato)
set -g window-style 'fg=#a5adcb,bg=#1e2030'
set -g window-active-style 'fg=#cad3f5,bg=#24273a'

set -g window-status-format "#I"
set -g window-status-current-format "#I"
set -g window-status-style "fg=brightblack"
set -g window-status-current-style "fg=magenta,bold"
set -g window-status-bell-style "fg=red,nobold"

# TPM init (반드시 가장 마지막 줄)
run '~/.tmux/plugins/tpm/tpm'
