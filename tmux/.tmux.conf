# ===== 기본 설정 =====
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g detach-on-destroy off

# vi 모드
set-window-option -g mode-keys vi

# ===== 키 바인딩 =====
# 분할 시 현재 디렉터리 유지
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# 설정 reload
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded!"

# ===== Work Dev/Debug 세션 =====
# Prefix + S: 일반 dev 세션 (BE + FE 평범 실행)
bind-key S run-shell "~/.tmux/scripts/start-dev-session.sh '#{pane_current_path}'"

# Prefix + B: 디버그 세션 (BE는 nvim DAP, FE는 pnpm start)
bind-key B run-shell "~/.tmux/scripts/start-debug-session.sh '#{pane_current_path}'"

# ===== Catppuccin 테마 & Status Bar =====
set -g @catppuccin_flavor "macchiato" # latte, frappe, macchiato, mocha

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

# Status bar
set -g status-justify left
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Window 색감 (macchiato)
set -g window-style 'fg=#a5adcb,bg=#1e2030'
set -g window-active-style 'fg=#cad3f5,bg=#24273a'

set -g window-status-format "#I"
set -g window-status-current-format "#I"
set -g window-status-style "fg=brightblack"
set -g window-status-current-style "fg=magenta,bold"
set -g window-status-bell-style "fg=red,nobold"

# TPM init (반드시 가장 마지막 줄)
run '~/.tmux/plugins/tpm/tpm'
